# Example renmori configuration. Place this as renmori.toml next to your built
# game directory (or pass --config). Every field is optional; the defaults shown
# are what renmori uses with no config at all. CLI flags override these, and
# --exclude is added on top of the list here.

[protect]
# Plaintext bytes per encrypted chunk. Larger = slightly less overhead, coarser
# random-access granularity. Default 65536.
chunk_size = 65536

# Game-relative globs to leave UNENCRYPTED on disk (fnmatch semantics; "*" spans
# "/"). Use for files that must be read by other tools, or third-party content
# whose license requires it to stay replaceable (e.g. an LGPL library's files).
exclude = [
    # "readme.txt",
    # "thirdparty/*",
]

# Disable the in-game developer console, developer mode, and data-export
# subcommands in the protected build. Default true. Turn off only for debugging.
lockdown = true

# Open tool supports "baseline". Higher strengths require the closed plugin.
strength = "baseline"

# Keep the packed originals on disk (debugging only). Default false.
keep_plaintext = false

[keys]
# Read keys from these environment variables (64 hex chars = 32 bytes) instead
# of generating a fresh random key per build. Use your CI's secret store; never
# commit keys. If unset, a random key is generated each build (recommended
# unless you have a reason to manage keys yourself). The script key is
# independent of the master key by design.
# master_env = "RENMORI_MASTER_KEY"
# script_env = "RENMORI_SCRIPT_KEY"
