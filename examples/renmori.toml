# renmori.toml — optional configuration for `renmori protect`
#
# Every key is optional and has a sensible default, so a zero-config run works.
# The command line overrides the file; --exclude extends the file's list rather
# than replacing it. renmori looks for this file beside the game directory and
# in the current working directory, or at the path given with -c/--config.

[protect]

# Protection strength. "auto" uses the closed plugin's strongest offering when a
# plugin is available (see docs/interface.md), and the open baseline otherwise.
# "baseline" forces the open format; "poly" requires the plugin.
strength = "auto"

# Disable the developer console, developer mode, and data-export subcommands in
# the protected build. Recommended on for a release.
lockdown = true

# Container chunk size in bytes (open baseline only; the poly engine chooses this
# per build). Larger favors large CG and video; smaller lowers tiny-file overhead.
# chunk_size = 65536

# Keep the packed plaintext originals on disk after protection, for debugging.
# Never enable this for a release.
keep_plaintext = false

# Game-relative globs to leave outside the container, unencrypted. Use this only
# for files read outside renpy.loader (for example by the Steam SDK).
exclude = []

# Files kept as plaintext on disk because they are read outside the engine. The
# default already covers the Steam app id.
keep_on_disk = ["steam_appid.txt"]

# Plugin only: target platforms to produce. Omit to auto-detect from the build's
# lib/py3-* directories.
# platforms = ["win-x64", "linux-x64", "mac-universal"]

# Plugin only: bind the keys to a native launcher and ship it, so the keys
# reconstruct only when the game is started through it.
launcher = false

[keys]

# Open baseline only: names of environment variables holding the hex container
# and script keys. When unset, a fresh random key is generated per run. The poly
# plugin derives its own keys and ignores this section.
# master_env = "RENMORI_MASTER_KEY"
# script_env = "RENMORI_SCRIPT_KEY"
